<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="grad-building" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="grad-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="grad-lawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="420" fill="url(#grad-sky)"/>

  <!-- Sun -->
  <circle cx="680" cy="110" r="50" fill="#fef08a" opacity="0.85"/>
  <circle cx="680" cy="110" r="70" fill="#fef08a" opacity="0.25"/>

  <!-- Background hills/campus trees -->
  <ellipse cx="200" cy="420" rx="300" ry="80" fill="#059669" opacity="0.7"/>
  <ellipse cx="600" cy="420" rx="320" ry="90" fill="#047857" opacity="0.8"/>

  <!-- Main College Academic Hall Building -->
  <rect x="180" y="160" width="440" height="250" rx="4" fill="url(#grad-building)"/>
  
  <!-- Central Classical Pediment & Dome -->
  <path d="M 320 160 L 400 90 L 480 160 Z" fill="#cbd5e1"/>
  <circle cx="400" cy="70" r="28" fill="#94a3b8"/>
  <rect x="396" y="32" width="8" height="20" fill="#e2e8f0"/>
  <polygon points="400,22 400,32 418,27" fill="#ef4444"/> <!-- Flag on top -->

  <!-- Grand Pillars -->
  <rect x="330" y="170" width="16" height="240" fill="#f1f5f9"/>
  <rect x="370" y="170" width="16" height="240" fill="#f1f5f9"/>
  <rect x="414" y="170" width="16" height="240" fill="#f1f5f9"/>
  <rect x="454" y="170" width="16" height="240" fill="#f1f5f9"/>

  <!-- Entablature / Architrave -->
  <rect x="310" y="160" width="180" height="15" fill="#94a3b8"/>

  <!-- Clock -->
  <circle cx="400" cy="130" r="16" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <line x1="400" y1="130" x2="400" y2="120" stroke="#0f172a" stroke-width="2"/>
  <line x1="400" y1="130" x2="408" y2="130" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Modern Wing Left -->
  <rect x="80" y="220" width="110" height="190" fill="#e2e8f0"/>
  <!-- Modern Wing Right -->
  <rect x="610" y="220" width="110" height="190" fill="#e2e8f0"/>

  <!-- Left Windows Grid -->
  <g fill="url(#grad-glass)">
    <rect x="95" y="240" width="32" height="40" rx="2"/>
    <rect x="142" y="240" width="32" height="40" rx="2"/>
    <rect x="95" y="300" width="32" height="40" rx="2"/>
    <rect x="142" y="300" width="32" height="40" rx="2"/>
    <rect x="95" y="360" width="32" height="40" rx="2"/>
    <rect x="142" y="360" width="32" height="40" rx="2"/>
    
    <!-- Central Windows -->
    <rect x="210" y="200" width="36" height="45" rx="3"/>
    <rect x="265" y="200" width="36" height="45" rx="3"/>
    <rect x="500" y="200" width="36" height="45" rx="3"/>
    <rect x="555" y="200" width="36" height="45" rx="3"/>

    <rect x="210" y="270" width="36" height="45" rx="3"/>
    <rect x="265" y="270" width="36" height="45" rx="3"/>
    <rect x="500" y="270" width="36" height="45" rx="3"/>
    <rect x="555" y="270" width="36" height="45" rx="3"/>

    <!-- Right Windows Grid -->
    <rect x="625" y="240" width="32" height="40" rx="2"/>
    <rect x="672" y="240" width="32" height="40" rx="2"/>
    <rect x="625" y="300" width="32" height="40" rx="2"/>
    <rect x="672" y="300" width="32" height="40" rx="2"/>
    <rect x="625" y="360" width="32" height="40" rx="2"/>
    <rect x="672" y="360" width="32" height="40" rx="2"/>
  </g>

  <!-- Grand Entrance Portal -->
  <path d="M 370 410 L 370 330 Q 400 315 430 330 L 430 410 Z" fill="#1e293b"/>

  <!-- Foreground Green Lawn & Walkway -->
  <path d="M 0 410 L 800 410 L 800 600 L 0 600 Z" fill="url(#grad-lawn)"/>
  <!-- Central Paved Walkway -->
  <polygon points="340,410 460,410 580,600 220,600" fill="#e2e8f0"/>
  <polygon points="350,410 450,410 560,600 240,600" fill="#f8fafc"/>

  <!-- Campus Trees & Students Walking -->
  <circle cx="160" cy="450" r="35" fill="#065f46"/>
  <rect x="156" y="450" width="8" height="45" fill="#78350f"/>
  <circle cx="640" cy="450" r="38" fill="#065f46"/>
  <rect x="636" y="450" width="8" height="45" fill="#78350f"/>

  <!-- Stylized Student Figures walking on campus -->
  <g transform="translate(310, 480) scale(0.7)">
    <circle cx="20" cy="20" r="9" fill="#0f172a"/>
    <path d="M 12 33 L 28 33 L 26 70 L 14 70 Z" fill="#2563eb"/>
    <line x1="14" y1="70" x2="10" y2="105" stroke="#0f172a" stroke-width="4"/>
    <line x1="26" y1="70" x2="30" y2="105" stroke="#0f172a" stroke-width="4"/>
    <!-- Backpack -->
    <rect x="6" y="35" width="8" height="24" rx="3" fill="#ea580c"/>
  </g>

  <g transform="translate(450, 490) scale(0.68)">
    <circle cx="20" cy="20" r="9" fill="#0f172a"/>
    <path d="M 12 33 L 28 33 L 26 70 L 14 70 Z" fill="#7c3aed"/>
    <line x1="14" y1="70" x2="18" y2="105" stroke="#0f172a" stroke-width="4"/>
    <line x1="26" y1="70" x2="22" y2="105" stroke="#0f172a" stroke-width="4"/>
    <!-- Notebook -->
    <rect x="28" y="42" width="10" height="15" rx="1" fill="#facc15"/>
  </g>
</svg>

